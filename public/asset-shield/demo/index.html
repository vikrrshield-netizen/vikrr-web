<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo VIKRR Asset Shield | Falešná provozní data</title>
  <meta name="description" content="Interaktivní veřejné demo VIKRR Asset Shield s falešnými provozními daty.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#10231d">
  <style>
    *,*::before,*::after{box-sizing:border-box}*{margin:0}
    :root{--ink:#10231d;--muted:#63736b;--paper:#f2ece3;--card:#fffdf8;--line:#ded5c8;--green:#147a5a;--mint:#e4f5ec;--blue:#216096;--amber:#bc7712;--red:#b83b2f;--shadow:0 18px 48px rgba(16,35,29,.12)}
    body{min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#f4eee6 0%,#faf7f0 58%,#edf4ef 100%);line-height:1.45;-webkit-font-smoothing:antialiased}
    button,a{font:inherit;color:inherit}button{cursor:pointer}a{text-decoration:none}.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.side{position:sticky;top:0;height:100vh;padding:20px;background:#10231d;color:white;display:flex;flex-direction:column;gap:18px}.brand{display:flex;align-items:center;gap:10px;font-weight:950}.brand-mark{width:38px;height:38px;border-radius:14px;background:#e4f5ec;color:#10231d;display:grid;place-items:center}.demo-pill{display:inline-flex;width:max-content;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:7px 10px;color:#b9d4c9;font-size:.78rem;font-weight:850}
    .nav{display:grid;gap:8px}.nav button{min-height:44px;border:1px solid transparent;border-radius:14px;background:transparent;color:#d8e6df;text-align:left;padding:0 12px;font-weight:820}.nav button.active{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.16);color:white}.side-foot{margin-top:auto;color:#b7c8c0;font-size:.86rem}.side-foot a{display:inline-flex;margin-top:10px;border-radius:999px;background:white;color:#10231d;padding:10px 13px;font-weight:850}
    .main{padding:24px 28px 48px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:22px}.top h1{font-size:clamp(1.8rem,3vw,3rem);line-height:1;letter-spacing:-.035em}.top p{margin-top:8px;color:var(--muted);max-width:760px}.top-actions{display:flex;gap:10px;flex-wrap:wrap}.btn{min-height:42px;border:1px solid rgba(16,35,29,.14);border-radius:999px;background:var(--card);padding:0 15px;font-weight:850}.btn.dark{background:var(--ink);border-color:var(--ink);color:white}.btn.green{background:var(--green);border-color:var(--green);color:white}.btn.red{background:#fee8e5;border-color:#f4b9b3;color:#9d2f27}
    .grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:14px}.kpi,.panel,.card{border:1px solid rgba(16,35,29,.1);border-radius:22px;background:var(--card);box-shadow:var(--shadow)}.kpi{padding:18px}.kpi small{color:var(--muted);font-weight:900;text-transform:uppercase;font-size:.72rem}.kpi strong{display:block;margin-top:8px;font-size:2rem;line-height:1}.kpi span{display:block;margin-top:4px;color:var(--muted);font-size:.86rem}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px}.panel{padding:18px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.panel h2{font-size:1.1rem}.list{display:grid;gap:10px}.row{width:100%;border:1px solid rgba(16,35,29,.1);border-radius:18px;background:white;padding:14px;text-align:left;display:grid;gap:6px}.row:hover{border-color:rgba(20,122,90,.38)}.row-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.title{font-weight:900}.meta{color:var(--muted);font-size:.88rem}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:.76rem;font-weight:900}.b-red{background:#fee8e5;color:#a03028}.b-amber{background:#fff0d6;color:#8a560e}.b-green{background:#dcf5e9;color:#0b684a}.b-blue{background:#e4f0fb;color:#1e5b8d}.b-gray{background:#eee8df;color:#59665f}
    .detail{position:sticky;top:24px}.detail-body{display:grid;gap:12px}.detail-card{border:1px solid rgba(16,35,29,.1);border-radius:18px;background:white;padding:14px}.detail-card small{color:var(--muted);font-weight:900;text-transform:uppercase;font-size:.7rem}.detail-card strong{display:block;margin-top:5px}.chart{height:110px;border:1px solid rgba(16,35,29,.08);border-radius:16px;background:linear-gradient(180deg,#eef9f4,#fff);display:flex;align-items:end;gap:9px;padding:12px}.bar{flex:1;border-radius:9px 9px 0 0;background:linear-gradient(180deg,#1e9f77,#147a5a);min-height:12px}
    .cards{grid-template-columns:repeat(2,1fr)}.asset-card{padding:16px}.asset-card h3{font-size:1.04rem}.asset-card p{margin-top:6px;color:var(--muted);font-size:.9rem}.asset-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
    .toast{position:fixed;right:22px;bottom:22px;z-index:30;min-width:260px;max-width:360px;border-radius:18px;background:#10231d;color:white;padding:14px 16px;box-shadow:0 20px 50px rgba(16,35,29,.25);font-weight:820;display:none}.toast.show{display:block}
    @media(max-width:980px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.nav{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}.detail{position:static}.kpis{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:560px){.main{padding:18px 12px 34px}.nav{grid-template-columns:1fr 1fr}.top{display:grid}.top-actions{width:100%}.btn{width:100%}.kpis,.cards{grid-template-columns:1fr}.side{padding:16px}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand"><span class="brand-mark">AS</span><span>Asset Shield</span></div>
      <span class="demo-pill">Veřejné demo · falešná data</span>
      <div class="nav" id="nav"></div>
      <div class="side-foot">
        Toto demo není napojené na ostrou databázi. Změny se po obnovení stránky zahodí.
        <a href="/asset-shield/">Zpět na produkt</a>
      </div>
    </aside>
    <main class="main">
      <div class="top">
        <div><h1 id="pageTitle">Dashboard</h1><p id="pageText">Proklikněte si falešný provoz: úkoly, zařízení, kontroly, převodovky, dataloggery a kiosk.</p></div>
        <div class="top-actions"><button class="btn" id="resetBtn">Reset demo dat</button><a class="btn dark" href="#contact" onclick="demoToast('Kontakt: info@vikrr.com')">Domluvit implementaci</a></div>
      </div>
      <div id="view"></div>
    </main>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const seed={tasks:[{id:"WO-2606-014",title:"Převodovka 3: neobvyklý zvuk",place:"Extruder 3",prio:"P1",status:"Nové",type:"Porucha"},{id:"WO-2606-011",title:"Balírna: kontrola ochranného krytu",place:"Balírna",prio:"P2",status:"Probíhá",type:"Údržba"},{id:"WO-2606-008",title:"Hmyzolapač 2: výměna trubice",place:"Expedice",prio:"P3",status:"Čeká",type:"Pest"}],assets:[{id:"A-101",name:"Extruder 3",place:"Výrobní hala D",state:"Riziko",detail:"Napojená převodovka 3, poslední záznam hluku."},{id:"A-204",name:"Datalogger 16930446",place:"Měřidla",state:"OK",detail:"Poslední teplota 5,2 °C, vlhkost 62 %."},{id:"A-309",name:"Hmyzolapač 1",place:"Expedice",state:"Po termínu",detail:"Poslední kontrola před 34 dny."},{id:"A-420",name:"Míchárna I.",place:"D1.02",state:"OK",detail:"Navázaná na výrobní plán a kontrolu místnosti."}],checks:[{room:"Kotelna",code:"D1.01",status:"OK",note:"Bez závad, revizní štítky čitelné."},{room:"Míchárna I.",code:"D1.02",status:"Závada",note:"Prasklina u světla, založen úkol WO-2606-017."},{room:"Sklad surovin",code:"D1.08",status:"OK",note:"Regály, štítky, čistota OK."},{room:"Balírna",code:"D1.13",status:"Závada",note:"Poškozený kryt dopravníku."}],gearboxes:[{name:"Převodovka 1",extruder:"Extruder 1",temp:59,amps:41,state:"V provozu"},{name:"Převodovka 3",extruder:"Extruder 3",temp:74,amps:55,state:"Nepouštět"},{name:"Převodovka 5",extruder:"Sklad ND",temp:0,amps:0,state:"Ve skladu"}],logs:[5.2,5.4,5.1,4.9,5.3,5.2]};
    let data=JSON.parse(JSON.stringify(seed));let current="dashboard";let selected=null;
    const pages={dashboard:["Dashboard","Rychlý přehled falešné továrny."],assets:["Kartotéka","Karty místností, strojů a zařízení s historií."],tasks:["Úkoly","Servisní práce od nahlášení po dokončení."],checks:["Kontroly","Výsledek kontroly jako doklad k datu."],gearboxes:["Převodovky","Stav převodovek, teplota, zátěž a rychlá výměna."],dataloggers:["Dataloggery","Denní teploty skladů a měřidel."],kiosk:["Kiosk","Zápis závady a měření z pohledu obsluhy."]};
    function badge(v){const cls=v==="OK"||v==="V provozu"?"b-green":v==="P1"||v==="Nepouštět"||v==="Závada"||v==="Riziko"?"b-red":v==="P2"||v==="Po termínu"?"b-amber":v==="Nové"?"b-blue":"b-gray";return `<span class="badge ${cls}">${v}</span>`}
    function demoToast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2600)}
    function setPage(p){current=p;selected=null;render()}
    function renderNav(){document.getElementById("nav").innerHTML=Object.entries(pages).map(([id,[title]])=>`<button class="${current===id?"active":""}" onclick="setPage('${id}')">${title}</button>`).join("")}
    function kpis(){return `<div class="grid kpis"><div class="kpi"><small>Otevřené úkoly</small><strong>${data.tasks.filter(t=>t.status!=="Hotovo").length}</strong><span>falešná data</span></div><div class="kpi"><small>Zařízení</small><strong>${data.assets.length}</strong><span>sledované karty</span></div><div class="kpi"><small>Závady kontroly</small><strong>${data.checks.filter(c=>c.status==="Závada").length}</strong><span>v posledním runu</span></div><div class="kpi"><small>Teplota skladu</small><strong>${data.logs.at(-1).toFixed(1)} °C</strong><span>datalogger demo</span></div></div>`}
    function row(title,meta,b,click){return `<button class="row" onclick="${click}"><span class="row-top"><span class="title">${title}</span>${b||""}</span><span class="meta">${meta}</span></button>`}
    function detail(obj){if(!obj)return `<div class="detail-card"><small>Detail</small><strong>Vyberte položku</strong><p class="meta">Klikněte na řádek vlevo. Demo pracuje jen s falešnými daty.</p></div>`;return `<div class="detail-card"><small>${obj.type||obj.state||obj.status||"Detail"}</small><strong>${obj.title||obj.name||obj.room}</strong><p class="meta">${obj.place||obj.code||obj.extruder||""}</p><p>${obj.detail||obj.note||"Ukázkový záznam pro demo."}</p></div>`}
    function dashboard(){return `${kpis()}<div class="layout"><section class="panel"><div class="panel-head"><h2>Co se děje teď</h2><button class="btn" onclick="setPage('kiosk')">Zapsat z kiosku</button></div><div class="list">${data.tasks.map((t,i)=>row(t.title,`${t.id} · ${t.place}`,badge(t.prio),`selected=data.tasks[${i}];render()`)).join("")}</div></section><aside class="panel detail"><div class="detail-body">${detail(selected)}<div class="detail-card"><small>Trend teploty</small><div class="chart">${data.logs.map(v=>`<i class="bar" style="height:${18+v*12}px"></i>`).join("")}</div></div></div></aside></div>`}
    function assets(){return `<div class="grid cards">${data.assets.map((a,i)=>`<article class="card asset-card"><span>${badge(a.state)}</span><h3>${a.name}</h3><p>${a.place}</p><p>${a.detail}</p><div class="asset-actions"><button class="btn" onclick="selected=data.assets[${i}];setPage('tasks')">Nový úkol</button><button class="btn" onclick="demoToast('Otevřen rodný list: ${a.name}')">Rodný list</button></div></article>`).join("")}</div>`}
    function tasks(){return `<div class="layout"><section class="panel"><div class="panel-head"><h2>Servisní úkoly</h2><button class="btn green" onclick="addTask()">+ Ukázkový úkol</button></div><div class="list">${data.tasks.map((t,i)=>row(t.title,`${t.id} · ${t.place} · ${t.status}`,badge(t.prio),`selected=data.tasks[${i}];render()`)).join("")}</div></section><aside class="panel detail"><div class="detail-body">${detail(selected)}<button class="btn green" onclick="finishSelected()">Dokončit vybraný úkol</button></div></aside></div>`}
    function checks(){return `<div class="panel"><div class="panel-head"><h2>Kontrola budovy D · 13. 6. 2026</h2><button class="btn" onclick="demoToast('Export XLSX/PDF v demu pouze simuluje výstup')">Export dokladu</button></div><div class="list">${data.checks.map((c,i)=>row(`${c.code} ${c.room}`,c.note,badge(c.status),`selected=data.checks[${i}];render()`)).join("")}</div></div>`}
    function gearboxes(){return `<div class="grid cards">${data.gearboxes.map(g=>`<article class="card asset-card"><span>${badge(g.state)}</span><h3>${g.name}</h3><p>${g.extruder}</p><p>${g.temp?`${g.temp} °C · ${g.amps} A`:"náhradní kus ve skladu"}</p><div class="asset-actions"><button class="btn red" onclick="demoToast('${g.name}: výměna by založila servisní stopu')">Nejede → výměna</button><button class="btn" onclick="demoToast('Otevřen trend ${g.name}')">Trend</button></div></article>`).join("")}</div>`}
    function dataloggers(){return `<div class="panel"><div class="panel-head"><h2>Datalogger 16930446 · Měřidla</h2>${badge("OK")}</div><div class="chart">${data.logs.map(v=>`<i class="bar" style="height:${20+v*13}px"></i>`).join("")}</div><p class="meta" style="margin-top:12px">Falešná historie: ${data.logs.map(v=>v.toFixed(1)+" °C").join(" · ")}</p></div>`}
    function kiosk(){return `<div class="panel"><div class="panel-head"><h2>Kiosk obsluhy</h2><span class="badge b-blue">role: operátor</span></div><div class="grid cards"><article class="card"><h3>Nahlásit závadu</h3><p>Simulace vytvoří nový úkol k Extruderu 3.</p><button class="btn red" onclick="addTask('Kiosk: nezvyklý zvuk u extruderu','Extruder 3','P1')">Nahlásit</button></article><article class="card"><h3>Zapsat teplotu</h3><p>Přidá falešnou hodnotu do trendu dataloggeru.</p><button class="btn green" onclick="data.logs.push(+(4.8+Math.random()).toFixed(1));demoToast('Teplota zapsána do demo trendu');render()">Zapsat</button></article></div></div>`}
    function addTask(title="Nový ukázkový úkol z dema",place="Balírna",prio="P2"){data.tasks.unshift({id:"WO-DEMO-"+String(100+data.tasks.length),title,place,prio,status:"Nové",type:"Demo"});demoToast("Úkol přidán do demo dat");render()}
    function finishSelected(){if(!selected||!selected.id)return demoToast("Nejdřív vyberte úkol");selected.status="Hotovo";demoToast("Úkol označen jako hotový v demo datech");render()}
    function render(){renderNav();const [title,text]=pages[current];document.getElementById("pageTitle").textContent=title;document.getElementById("pageText").textContent=text;document.getElementById("view").innerHTML=({dashboard,assets,tasks,checks,gearboxes,dataloggers,kiosk})[current]()}
    document.getElementById("resetBtn").onclick=()=>{data=JSON.parse(JSON.stringify(seed));selected=null;demoToast("Demo data resetována");render()};render();
  </script>
</body>
</html>
