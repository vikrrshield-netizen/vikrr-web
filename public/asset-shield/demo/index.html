<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo VIKRR Asset Shield | Falešná provozní data</title>
  <meta name="description" content="Interaktivní demo VIKRR Asset Shield s falešnými daty pro kartotéku, úkoly, kontroly, převodovky, dataloggery a kiosk.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#10231d">
  <style>
    *,*::before,*::after{box-sizing:border-box}*{margin:0}
    :root{--ink:#10231d;--muted:#62736b;--paper:#f1ece3;--card:#fffdf8;--line:#ded5c8;--green:#137a5b;--green2:#0c654b;--blue:#24639a;--amber:#b87513;--red:#b83a2f;--soft:#f8f4ed;--shadow:0 18px 44px rgba(16,35,29,.12)}
    body{min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--paper);line-height:1.45;-webkit-font-smoothing:antialiased}
    button,a{font:inherit;color:inherit}button{cursor:pointer}a{text-decoration:none}.app{min-height:100vh;display:grid;grid-template-columns:268px minmax(0,1fr)}
    .side{position:sticky;top:0;height:100vh;padding:18px;background:#10231d;color:white;display:flex;flex-direction:column;gap:16px}.brand{display:flex;align-items:center;gap:11px;font-weight:950}.brand-mark{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#e4f4ec;color:#10231d}.demo-pill{width:max-content;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:7px 10px;color:#b9d4c9;font-size:.78rem;font-weight:850}
    .nav{display:grid;gap:7px}.nav button{min-height:44px;border:1px solid transparent;border-radius:14px;background:transparent;color:#d8e6df;text-align:left;padding:0 12px;font-weight:820}.nav button.active{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.16);color:white}.side-note{margin-top:auto;color:#b7c8c0;font-size:.86rem}.side-note a{display:inline-flex;margin-top:10px;border-radius:999px;background:white;color:#10231d;padding:10px 13px;font-weight:850}
    .main{padding:22px 28px 42px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:18px}.crumb{color:var(--muted);font-size:.86rem;font-weight:760}.top h1{margin-top:4px;font-size:clamp(1.8rem,3vw,2.85rem);line-height:1;letter-spacing:-.035em}.top p{margin-top:8px;color:var(--muted);max-width:760px}.top-actions{display:flex;gap:10px;flex-wrap:wrap}.btn{min-height:42px;border:1px solid rgba(16,35,29,.14);border-radius:999px;background:var(--card);padding:0 15px;font-weight:850;display:inline-flex;align-items:center;justify-content:center}.btn.dark{background:var(--ink);border-color:var(--ink);color:white}.btn.green{background:var(--green);border-color:var(--green);color:white}.btn.red{background:#fee8e5;border-color:#f1bbb5;color:#942e27}.btn.blue{background:#e6f1fb;border-color:#bfd8ef;color:#1f5f92}
    .grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:14px}.kpi,.panel,.card{border:1px solid rgba(16,35,29,.1);border-radius:22px;background:var(--card);box-shadow:var(--shadow)}.kpi{padding:17px}.kpi small{display:block;color:var(--muted);font-size:.72rem;font-weight:900;text-transform:uppercase}.kpi strong{display:block;margin-top:7px;font-size:2rem;line-height:1}.kpi span{display:block;margin-top:4px;color:var(--muted);font-size:.86rem}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px}.panel{padding:18px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.panel h2{font-size:1.08rem}.list{display:grid;gap:10px}.row{width:100%;border:1px solid rgba(16,35,29,.1);border-radius:18px;background:white;padding:14px;text-align:left;display:grid;gap:6px}.row:hover{border-color:rgba(19,122,91,.38)}.row-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.title{font-weight:900}.meta{color:var(--muted);font-size:.88rem}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:.76rem;font-weight:900;white-space:nowrap}.b-red{background:#fee8e5;color:#9f3028}.b-amber{background:#fff0d7;color:#87520e}.b-green{background:#dcf5e9;color:#0c684b}.b-blue{background:#e4f0fb;color:#1f5f92}.b-gray{background:#eee8df;color:#59665f}
    .detail{position:sticky;top:20px}.detail-body{display:grid;gap:12px}.detail-card{border:1px solid rgba(16,35,29,.1);border-radius:18px;background:white;padding:14px}.detail-card small{display:block;color:var(--muted);font-weight:900;text-transform:uppercase;font-size:.7rem}.detail-card strong{display:block;margin-top:5px}.detail-card p{margin-top:7px;color:#405048}.history{display:grid;gap:8px}.history div{border-left:4px solid var(--green);background:#f7fbf8;border-radius:14px;padding:10px 12px;font-size:.9rem}.history .warn{border-left-color:var(--red);background:#fff1ee}.history .repair{border-left-color:var(--amber);background:#fff7e8}
    .cards{grid-template-columns:repeat(2,minmax(0,1fr))}.asset-card{padding:16px}.asset-card h3{margin-top:8px;font-size:1.08rem}.asset-card p{margin-top:6px;color:var(--muted);font-size:.9rem}.asset-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
    .chart{height:116px;border:1px solid rgba(16,35,29,.08);border-radius:16px;background:linear-gradient(180deg,#eef9f4,#fff);display:flex;align-items:end;gap:9px;padding:12px}.bar{flex:1;border-radius:9px 9px 0 0;background:linear-gradient(180deg,#1e9f77,#137a5b);min-height:12px}.tree{display:grid;gap:10px}.tree-row{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;border:1px solid rgba(16,35,29,.1);background:white;border-radius:18px;padding:13px}.letter{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#eef0ff;color:#5066de;font-weight:950}.room{padding-left:18px}.room .letter{background:#eaf7ee;color:#137a5b}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.inspection-card{border:1px solid rgba(16,35,29,.1);border-radius:18px;background:white;padding:14px;display:grid;gap:8px}.inspection-card.defect{border-color:#f2b9b2;background:#fff7f5}.large-tile{min-height:132px;border:1px solid rgba(16,35,29,.1);border-radius:22px;background:white;padding:18px;text-align:left}.large-tile h3{font-size:1.15rem}.large-tile p{margin-top:8px;color:var(--muted)}
    .toast{position:fixed;right:22px;bottom:22px;z-index:30;min-width:260px;max-width:380px;border-radius:18px;background:#10231d;color:white;padding:14px 16px;box-shadow:0 20px 50px rgba(16,35,29,.25);font-weight:820;display:none}.toast.show{display:block}
    @media(max-width:1040px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.nav{grid-template-columns:repeat(4,1fr)}.layout,.split{grid-template-columns:1fr}.detail{position:static}.kpis{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:620px){.main{padding:18px 12px 34px}.nav{grid-template-columns:1fr 1fr}.top{display:grid}.top-actions,.btn{width:100%}.kpis,.cards{grid-template-columns:1fr}.tree-row{grid-template-columns:38px 1fr}.tree-row .badge{grid-column:2}.side{padding:16px}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand"><span class="brand-mark">AS</span><span>Asset Shield</span></div>
      <span class="demo-pill">Veřejné demo · falešná data</span>
      <div class="nav" id="nav"></div>
      <div class="side-note">
        Demo není napojené na ostrou databázi. Změny se po obnovení stránky zahodí.
        <a href="/asset-shield/">Zpět na produkt</a>
      </div>
    </aside>

    <main class="main">
      <div class="top">
        <div><div class="crumb">VIKRR Asset Shield / veřejné demo</div><h1 id="pageTitle">Dashboard</h1><p id="pageText">Provozní přehled malé falešné továrny.</p></div>
        <div class="top-actions"><button class="btn" id="resetBtn">Reset demo dat</button><a class="btn dark" href="#" onclick="demoToast('Kontakt: info@vikrr.com');return false;">Domluvit implementaci</a></div>
      </div>
      <div id="view"></div>
    </main>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const seed={tasks:[{id:"WO-2606-014",title:"Převodovka 3: neobvyklý zvuk",place:"Extruder 3",prio:"P1",status:"Nové",type:"Porucha",detail:"Obsluha označila extruder jako nepouštět. Doporučená výměna za náhradní kus."},{id:"WO-2606-011",title:"Balírna: kontrola ochranného krytu",place:"Balírna",prio:"P2",status:"Probíhá",type:"Údržba",detail:"Kryt dopravníku se viklá. Technik převzal úkol."},{id:"WO-2606-008",title:"Hmyzolapač 2: výměna trubice",place:"Expedice",prio:"P3",status:"Čeká",type:"Pest",detail:"Po termínu pravidelné kontroly, doporučena fotka misky."}],assets:[{id:"A-101",name:"Extruder 3",place:"Budova D · Extrudovna II",state:"Riziko",detail:"Napojená převodovka 3. Poslední záznam: neobvyklý zvuk a zvýšená zátěž."},{id:"A-103",name:"Převodovka 3",place:"Extruder 3",state:"Nepouštět",detail:"Teplota 74 °C, zátěž 55 A, čeká výměna."},{id:"A-204",name:"Datalogger 16930446",place:"Budova D · Měřidla",state:"OK",detail:"Poslední teplota 5,2 °C, vlhkost 62 %."},{id:"A-309",name:"Hmyzolapač 1",place:"Expedice",state:"Po termínu",detail:"Poslední kontrola před 34 dny, chybí fotka misky."}],checks:[{room:"Kotelna",code:"D1.01",status:"OK",note:"Bez závad, revizní štítky čitelné."},{room:"Míchárna I.",code:"D1.02",status:"Závada",note:"Prasklina u světla, založen úkol WO-2606-017."},{room:"Sklad surovin",code:"D1.08",status:"OK",note:"Regály, štítky, čistota OK."},{room:"Balírna",code:"D1.13",status:"Závada",note:"Poškozený kryt dopravníku."}],gearboxes:[{name:"Převodovka 1",extruder:"Extruder 1",temp:59,amps:41,state:"V provozu"},{name:"Převodovka 3",extruder:"Extruder 3",temp:74,amps:55,state:"Nepouštět"},{name:"Převodovka 5",extruder:"Sklad ND",temp:null,amps:null,state:"Ve skladu"}],logs:[5.2,5.4,5.1,4.9,5.3,5.2]};
    const pages={dashboard:["Dashboard","Provozní přehled malé falešné továrny."],kartoteka:["Kartotéka","Budovy, místnosti, stroje a rodné listy zařízení."],ukoly:["Úkoly","Servisní práce od nahlášení po dokončení."],kontroly:["Kontroly","Výsledek kontroly jako doklad k datu."],prevodovky:["Převodovky","Stav převodovek, rychlá výměna a servisní stopa."],dataloggery:["Dataloggery","Denní teploty, vlhkost a jednoduchý trend."],kiosk:["Kiosk","Zápis závady a měření z pohledu obsluhy."]};
    let data=JSON.parse(JSON.stringify(seed));let current="dashboard";let selected=null;
    function badge(v){const cls=v==="OK"||v==="V provozu"?"b-green":v==="P1"||v==="Nepouštět"||v==="Závada"||v==="Riziko"?"b-red":v==="P2"||v==="Po termínu"?"b-amber":v==="Nové"?"b-blue":"b-gray";return `<span class="badge ${cls}">${v}</span>`}
    function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2600)}
    window.demoToast=toast;
    function setPage(p){current=p;selected=null;render()}
    window.setPage=setPage;
    function renderNav(){document.getElementById("nav").innerHTML=Object.entries(pages).map(([id,[title]])=>`<button class="${current===id?"active":""}" onclick="setPage('${id}')">${title}</button>`).join("")}
    function row(obj,i,collection){return `<button class="row" onclick="selected=data.${collection}[${i}];render()"><span class="row-top"><span class="title">${obj.title||obj.name||obj.room}</span>${badge(obj.prio||obj.state||obj.status)}</span><span class="meta">${obj.id||obj.code||""} · ${obj.place||obj.extruder||obj.note||""}</span></button>`}
    function detail(obj){if(!obj)return `<div class="detail-card"><small>Detail</small><strong>Vyberte položku</strong><p>Klikněte na řádek vlevo. Demo používá jen připravená falešná data.</p></div>`;return `<div class="detail-card"><small>${obj.type||obj.state||obj.status||"Detail"}</small><strong>${obj.title||obj.name||obj.room}</strong><p class="meta">${obj.place||obj.code||obj.extruder||""}</p><p>${obj.detail||obj.note||"Ukázkový záznam pro demo."}</p></div>`}
    function kpis(){return `<div class="grid kpis"><div class="kpi"><small>Otevřené úkoly</small><strong>${data.tasks.filter(t=>t.status!=="Hotovo").length}</strong><span>včetně P1 z kiosku</span></div><div class="kpi"><small>Sledované karty</small><strong>${data.assets.length}</strong><span>místnosti, stroje, zařízení</span></div><div class="kpi"><small>Závady kontroly</small><strong>${data.checks.filter(c=>c.status==="Závada").length}</strong><span>poslední uzavřený doklad</span></div><div class="kpi"><small>Skladová teplota</small><strong>${data.logs.at(-1).toFixed(1)} °C</strong><span>datalogger Měřidla</span></div></div>`}
    function dashboard(){return `${kpis()}<div class="layout"><section class="panel"><div class="panel-head"><h2>Dnešní provoz</h2><button class="btn" onclick="setPage('kiosk')">Zapsat z kiosku</button></div><div class="list">${data.tasks.map((t,i)=>row(t,i,"tasks")).join("")}</div></section><aside class="panel detail"><div class="detail-body">${detail(selected)}<div class="detail-card"><small>Životní stopa</small><div class="history"><div class="warn">09:14 · Kiosk označil Extruder 3 jako nepouštět</div><div class="repair">09:31 · Údržba připravuje výměnu převodovky</div><div>10:05 · Datalogger Měřidla zapsal 5,2 °C</div></div></div></div></aside></div>`}
    function kartoteka(){return `<div class="layout"><section class="panel"><div class="panel-head"><h2>Kartotéka · Budova D</h2><span class="badge b-green">filtrovatelné podle patra</span></div><div class="tree"><div class="tree-row"><span class="letter">D</span><div><strong>D Výroba</strong><div class="meta">150 položek · 1.NP / 2.NP</div></div>${badge("OK")}</div><div class="tree-row room"><span class="letter">1</span><div><strong>Extrudovna II</strong><div class="meta">Extruder 3, Extruder 4, převodovky, dataloggery</div></div>${badge("Riziko")}</div><div class="tree-row room"><span class="letter">2</span><div><strong>Balírna</strong><div class="meta">kontroly, úkoly, hmyzolapače</div></div>${badge("P2")}</div><div class="tree-row room"><span class="letter">3</span><div><strong>Expedice</strong><div class="meta">hmyzolapače, skladové kontroly</div></div>${badge("Po termínu")}</div></div></section><aside class="panel detail"><div class="detail-body"><div class="detail-card"><small>Rodný list</small><strong>Extruder 3</strong><p>Umístění: Budova D / Extrudovna II. Navázané položky: Převodovka 3, Datalogger 16930446, výrobní plán.</p></div><div class="detail-card"><small>Historie</small><div class="history"><div class="warn">Porucha: neobvyklý zvuk převodovky</div><div class="repair">Servis: připravena výměna</div><div>Kontrola místnosti uzavřena s 1 závadou</div></div></div></div></aside></div>`}
    function ukoly(){return `<div class="layout"><section class="panel"><div class="panel-head"><h2>Úkoly podle priority</h2><button class="btn green" onclick="addTask()">+ Ukázkový úkol</button></div><div class="list">${data.tasks.map((t,i)=>row(t,i,"tasks")).join("")}</div></section><aside class="panel detail"><div class="detail-body">${detail(selected)}<button class="btn green" onclick="finishSelected()">Dokončit vybraný úkol</button></div></aside></div>`}
    function kontroly(){return `<div class="split"><section class="panel"><div class="panel-head"><h2>Provést kontrolu · Budova D</h2>${badge("Draft")}</div><div class="grid cards">${data.checks.map((c,i)=>`<article class="inspection-card ${c.status==="Závada"?"defect":""}"><span>${badge(c.status)}</span><h3>${c.code} ${c.room}</h3><p class="meta">${c.note}</p><button class="btn" onclick="selected=data.checks[${i}];render()">Detail bodu</button></article>`).join("")}</div></section><aside class="panel"><div class="panel-head"><h2>Hotové kontroly</h2><button class="btn" onclick="toast('Export XLSX/PDF v demu pouze simuluje výstup')">Export</button></div><div class="list"><div class="row"><span class="row-top"><span class="title">Kontrola budovy D</span>${badge("Uzavřeno")}</span><span class="meta">13. 6. 2026 · 4 body · 2 závady</span></div><div class="row"><span class="row-top"><span class="title">Kontrola skladu</span>${badge("OK")}</span><span class="meta">10. 6. 2026 · 8 bodů · 0 závad</span></div></div></aside></div>`}
    function prevodovky(){return `<div class="grid cards">${data.gearboxes.map(g=>`<article class="card asset-card"><span>${badge(g.state)}</span><h3>${g.name}</h3><p>${g.extruder}</p><p>${g.temp?`${g.temp} °C · ${g.amps} A`:"náhradní kus připravený ve skladu"}</p><div class="chart">${[42,48,g.temp||54,61,55].map(v=>`<i class="bar" style="height:${Math.max(12,v)}px"></i>`).join("")}</div><div class="asset-actions"><button class="btn red" onclick="toast('${g.name}: simulována výměna a servisní stopa')">Nejede → výměna</button><button class="btn" onclick="toast('Otevřen rodný list ${g.name}')">Rodný list</button></div></article>`).join("")}</div>`}
    function dataloggery(){return `<div class="layout"><section class="panel"><div class="panel-head"><h2>Dataloggery</h2>${badge("OK")}</div><div class="grid cards"><article class="card asset-card"><h3>Datalogger 16930446</h3><p>Budova D · Měřidla</p><p>5,2 °C · 62 % RH</p><div class="chart">${data.logs.map(v=>`<i class="bar" style="height:${20+v*13}px"></i>`).join("")}</div></article><article class="card asset-card"><h3>Datalogger 20930051</h3><p>Expedice</p><p>chybí dnešní zápis</p><button class="btn green" onclick="data.logs.push(+(4.8+Math.random()).toFixed(1));toast('Teplota zapsána do demo trendu');render()">Zapsat teplotu</button></article></div></section><aside class="panel detail">${detail({type:"Trend",name:"Historie měření",detail:data.logs.map(v=>v.toFixed(1)+" °C").join(" · ")})}</aside></div>`}
    function kiosk(){return `<div class="panel"><div class="panel-head"><h2>Kiosk obsluhy</h2><span class="badge b-blue">role: operátor</span></div><div class="grid cards"><button class="large-tile" onclick="addTask('Kiosk: nezvyklý zvuk u extruderu','Extruder 3','P1')"><h3>Nahlásit závadu</h3><p>Vytvoří servisní úkol k Extruderu 3.</p></button><button class="large-tile" onclick="data.logs.push(+(4.8+Math.random()).toFixed(1));toast('Teplota zapsána');render()"><h3>Zapsat teplotu</h3><p>Přidá falešnou hodnotu k dataloggeru.</p></button><button class="large-tile" onclick="toast('Předání směny uloženo do demo dat')"><h3>Předání směny</h3><p>Záznam pro další směnu.</p></button><button class="large-tile" onclick="setPage('prevodovky')"><h3>Převodovky</h3><p>Rychlý stav a výměna.</p></button></div></div>`}
    function addTask(title="Nový ukázkový úkol z dema",place="Balírna",prio="P2"){data.tasks.unshift({id:"WO-DEMO-"+String(100+data.tasks.length),title,place,prio,status:"Nové",type:"Demo",detail:"Tento úkol vznikl pouze ve veřejném demu."});toast("Úkol přidán do demo dat");render()}
    function finishSelected(){if(!selected||!selected.id)return toast("Nejdřív vyberte úkol");selected.status="Hotovo";toast("Úkol označen jako hotový v demo datech");render()}
    function render(){renderNav();const [title,text]=pages[current];document.getElementById("pageTitle").textContent=title;document.getElementById("pageText").textContent=text;document.getElementById("view").innerHTML=({dashboard,kartoteka,ukoly,kontroly,prevodovky,dataloggery,kiosk})[current]()}
    function renderNav(){document.getElementById("nav").innerHTML=Object.entries(pages).map(([id,[title]])=>`<button class="${current===id?"active":""}" onclick="setPage('${id}')">${title}</button>`).join("")}
    document.getElementById("resetBtn").onclick=()=>{data=JSON.parse(JSON.stringify(seed));selected=null;toast("Demo data resetována");render()};
    render();
  </script>
</body>
</html>
